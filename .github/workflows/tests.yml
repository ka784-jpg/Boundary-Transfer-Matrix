name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  kernels:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687
        with:
          version: '1.12.6'
      - name: Install locked environment
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - name: Test original kernels and example contracts
        run: julia --project=. --startup-file=no tests/runtests.jl
      - name: Run README example
        run: julia --project=. --startup-file=no examples/quickstart.jl results/ci
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install -r examples/requirements.txt
      - run: python tests/integrity.py --plots
